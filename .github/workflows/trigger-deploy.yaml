# Legacy Push-Based GitOps Workflow - DISABLED
# This workflow is disabled in favor of ci-pipeline.yaml for ArgoCD pull-based GitOps
# Re-enable this workflow if you need to test push-based GitOps comparison
name: Trigger Infrastructure Deployment

on:
  # Temporarily disabled - using ci-pipeline.yaml for ArgoCD GitOps instead
  # push:
  #   branches:
  #     - main
  #   paths-ignore:
  #     - 'README.md'
  #     - 'docs/**'
  
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - qa
          - prod
      version:
        description: 'Application version/tag'
        required: true
        default: 'latest'
      force_deploy:
        description: 'Force deployment even if no changes'
        required: false
        default: false
        type: boolean

  release:
    types: [published]

jobs:
  build-and-trigger:
    permissions:
      contents: read
      packages: write
      id-token: write
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      environment: ${{ steps.env.outputs.environment }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Determine version
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "release" ]]; then
            VERSION="${{ github.event.release.tag_name }}"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            # For push events, use commit SHA
            VERSION="${{ github.sha }}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Using version: $VERSION"

      - name: Determine environment
        id: env
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            ENV="${{ github.event.inputs.environment }}"
          elif [[ "${{ github.event_name }}" == "release" ]]; then
            ENV="prod"
          else
            ENV="dev"
          fi
          echo "environment=$ENV" >> $GITHUB_OUTPUT
          echo "Targeting environment: $ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push PHP-FPM image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/php-fpm/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/php-fpm:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository }}/php-fpm:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Nginx image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/nginx/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/nginx:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository }}/nginx:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger infrastructure deployment
        uses: peter-evans/repository-dispatch@v2
        with:
          token: ${{ secrets.INFRA_REPO_PAT }}
          repository: triplom/infrastructure-repo
          event-type: app-deployment-request
          client-payload: |
            {
              "app_name": "k8s-web-app-php",
              "repository": "${{ github.repository }}",
              "ref": "${{ github.ref }}",
              "version": "${{ steps.version.outputs.version }}",
              "environment": "${{ steps.env.outputs.environment }}",
              "triggered_by": "${{ github.actor }}",
              "commit_sha": "${{ github.sha }}",
              "workflow_run_id": "${{ github.run_id }}",
              "force_deploy": "${{ github.event.inputs.force_deploy || false }}"
            }

      - name: Deployment triggered
        run: |
          echo "🚀 Deployment triggered successfully!"
          echo "• Application: k8s-web-app-php"
          echo "• Version: ${{ steps.version.outputs.version }}"
          echo "• Environment: ${{ steps.env.outputs.environment }}"
          echo "• Repository: ${{ github.repository }}"
          echo "• Triggered by: ${{ github.actor }}"
          echo ""
          echo "Monitor the deployment at: https://github.com/triplom/infrastructure-repo/actions"