apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: k8s-web-app-php-dev

resources:
  - ../../base

patchesStrategicMerge:
  - patches.yaml

images:
  - name: php-fpm
    newName: ghcr.io/triplom/k8s-web-app-php/php-fpm
    newTag: ${VERSION}
  - name: nginx
    newName: ghcr.io/triplom/k8s-web-app-php/nginx
    newTag: ${VERSION}