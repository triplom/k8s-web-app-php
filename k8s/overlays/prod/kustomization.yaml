apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../../base
- ingress.yaml

namespace: k8s-web-app-php-prod

patches:
- target:
    kind: Deployment
    name: k8s-web-app-php
  patch: |-
    - op: replace
      path: /spec/template/spec/imagePullSecrets
      value:
      - name: github-registry-secret

configMapGenerator:
- name: k8s-web-app-php-config
  behavior: merge
  literals:
  - ENVIRONMENT=prod
  - LOG_LEVEL=DEBUG